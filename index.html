<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiragana Journey JRPG</title>
    <style>
        :root {
            --bg-color: #0f0f1b;
            --card-bg: #1a1b2f;
            --accent-cyan: #66fcf1;
            --accent-green: #00ff41;
            --accent-gold: #f7b733;
            --accent-purple: #bd93f9;
            --text-sub: #a0a5c0;
            --danger: #dc3545;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        #game-box {
            position: relative;
            width: 900px;
            max-width: 95vw;
            height: 620px;
            background-color: var(--card-bg);
            border: 3px solid var(--accent-cyan);
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(102, 252, 241, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header Navigation */
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 2px solid rgba(102, 252, 241, 0.3);
            font-size: 1.1rem;
            font-weight: bold;
        }

        .bar-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stat-val { color: var(--accent-gold); }

        .btn {
            background: transparent;
            color: var(--accent-cyan);
            border: 2px solid var(--accent-cyan);
            border-radius: 6px;
            padding: 5px 12px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        .btn.active {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
            color: #000;
            box-shadow: 0 0 10px var(--accent-purple);
        }

        /* Travel Stage Window */
        #stage-view {
            position: relative;
            height: 240px;
            background: linear-gradient(to bottom, #111325, #1f2240);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        #location-title {
            position: absolute;
            top: 15px;
            font-size: 1.4rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #path-display {
            display: flex;
            align-items: center;
            gap: 40px;
            margin-top: 30px;
        }

        .avatar {
            font-size: 3.5rem;
            filter: drop-shadow(0 0 8px var(--accent-cyan));
            transition: transform 0.2s;
        }

        .walking .avatar {
            animation: bounce 0.4s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        #distance-bar-wrap {
            width: 300px;
            height: 14px;
            background: #000;
            border: 2px solid var(--accent-cyan);
            border-radius: 8px;
            overflow: hidden;
        }

        #distance-bar {
            width: 0%;
            height: 100%;
            background: var(--accent-green);
            transition: width 0.3s ease;
        }

        /* Interaction Panel */
        #interactive-panel {
            flex: 1;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
        }

        #mode-instruction {
            font-size: 1.1rem;
            color: var(--text-sub);
            margin-bottom: 15px;
        }

        /* Sentence & Furigana Display */
        #sentence-container {
            display: flex;
            gap: 12px;
            font-size: 2.5rem;
            margin-bottom: 15px;
            min-height: 90px;
            align-items: flex-end;
        }

        ruby {
            ruby-position: over;
            display: inline-flex;
            flex-direction: column-reverse;
            align-items: center;
        }

        rt {
            font-size: 1.2rem;
            color: var(--accent-purple);
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        rb {
            color: #ffffff;
            font-weight: bold;
        }

        .char-unit {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .char-unit.completed {
            color: var(--accent-green) !important;
            text-shadow: 0 0 10px var(--accent-green);
        }

        .char-unit.active {
            color: var(--accent-gold) !important;
            transform: scale(1.15);
        }

        .char-unit.active rt {
            color: var(--accent-gold) !important;
        }

        /* Key Hint Badge */
        .key-hint {
            font-size: 0.8rem;
            background-color: var(--accent-purple);
            color: #000;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 6px;
            display: none;
        }

        .show-hints .key-hint {
            display: inline-block;
        }

        #english-translation {
            font-size: 1.3rem;
            color: var(--accent-cyan);
            font-style: italic;
            margin-top: 5px;
        }

        /* Overlay Modal */
        #screen-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 20, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 200;
        }

        #screen-overlay h1 {
            font-size: 3rem;
            color: var(--accent-cyan);
            margin-bottom: 10px;
            text-shadow: 0 0 15px var(--accent-cyan);
        }

        #screen-overlay p {
            font-size: 1.2rem;
            color: var(--text-sub);
            max-width: 80%;
            margin-bottom: 25px;
        }

        #start-btn {
            padding: 12px 35px;
            font-size: 1.3rem;
            background: transparent;
            color: var(--accent-cyan);
            border: 2px solid var(--accent-cyan);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        #start-btn:hover {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 15px var(--accent-cyan);
        }
    </style>
</head>
<body class="show-hints">

    <div id="game-box">
        <!-- Top Bar -->
        <div id="top-bar">
            <div class="bar-group">
                <div>SCORE: <span id="score" class="stat-val">0</span></div>
                <div>STAGE: <span id="stage-num" class="stat-val">1/4</span></div>
            </div>
            <div class="bar-group">
                <button id="hint-btn" class="btn active" onclick="toggleHints()">HINTS: ON</button>
                <button id="pause-btn" class="btn" onclick="togglePause()">PAUSE [ESC]</button>
            </div>
        </div>

        <!-- Stage Area -->
        <div id="stage-view">
            <div id="location-title">TOKYO STATION</div>
            <div id="path-display">
                <div id="player-avatar" class="avatar">🚶</div>
                <div id="distance-bar-wrap">
                    <div id="distance-bar"></div>
                </div>
                <div id="dest-avatar" class="avatar">🏯</div>
            </div>
        </div>

        <!-- Gameplay Panel -->
        <div id="interactive-panel">
            <div id="mode-instruction">Type the Hiragana to walk forward!</div>
            <div id="sentence-container"></div>
            <div id="english-translation"></div>
        </div>

        <!-- Modal Overlay -->
        <div id="screen-overlay">
            <h1 id="overlay-title">HIRAGANA JOURNEY</h1>
            <p id="overlay-desc">Walk to famous destinations in Japan by typing Hiragana, then learn real Japanese phrases using Kanji & Furigana!</p>
            <button id="start-btn" onclick="handleOverlayClick()">START JOURNEY</button>
        </div>
    </div>

    <script>
        // Keyboard Map (JIS layout mapping)
        const jisMap = {
            'q': 'た', 'w': 'て', 'e': 'い', 'r': 'す', 't': 'か', 'y': 'ん', 'u': 'な', 'i': 'に', 'o': 'ら', 'p': 'せ',
            'a': 'ち', 's': 'と', 'd': 'し', 'f': 'は', 'g': 'き', 'h': 'く', 'j': 'ま', 'k': 'の', 'l': 'り',
            'z': 'つ', 'x': 'さ', 'c': 'そ', 'v': 'ひ', 'b': 'こ', 'n': 'み', 'm': 'も',
            '1': 'ぬ', '2': 'ふ', '3': 'あ', '4': 'う', '5': 'え', '6': 'お', '7': 'や', '8': 'ゆ', '9': 'よ', '0': 'わ'
        };

        const walkingKanaPool = ['あ','い','う','え','お','か','き','く','け','こ','さ','し','す','せ','そ','た','ち','つ','て','と','ん'];

        // Adventure Quests Data
        const quests = [
            {
                location: "Tokyo Station",
                icon: "🚉",
                walkSteps: 4,
                phrases: [
                    {
                        en: '"Nice to meet you!"',
                        tokens: [
                            { kanji: "初", furigana: ["は", "じ"] },
                            { kanji: "めまして", furigana: ["め", "ま", "し", "て"] }
                        ]
                    },
                    {
                        en: '"Good morning!"',
                        tokens: [
                            { kanji: "お早", furigana: ["お", "は"] },
                            { kanji: "よう", furigana: ["よ", "う"] }
                        ]
                    }
                ]
            },
            {
                location: "Kyoto Shrine",
                icon: "⛩️",
                walkSteps: 5,
                phrases: [
                    {
                        en: '"Thank you very much!"',
                        tokens: [
                            { kanji: "有", furigana: ["あ"] },
                            { kanji: "難", furigana: ["り"] },
                            { kanji: "とう", furigana: ["が", "と", "う"] }
                        ]
                    },
                    {
                        en: '"Excuse me / Sorry!"',
                        tokens: [
                            { kanji: "すみません", furigana: ["す", "み", "ま", "せ", "ん"] }
                        ]
                    }
                ]
            },
            {
                location: "Osaka Castle",
                icon: "🏯",
                walkSteps: 5,
                phrases: [
                    {
                        en: '"Delicious!"',
                        tokens: [
                            { kanji: "美", furigana: ["お"] },
                            { kanji: "味", furigana: ["い"] },
                            { kanji: "しい", furigana: ["し", "い"] }
                        ]
                    },
                    {
                        en: '"Good evening!"',
                        tokens: [
                            { kanji: "今", furigana: ["こ"] },
                            { kanji: "晩", furigana: ["ん", "ば"] },
                            { kanji: "は", furigana: ["ん", "は"] }
                        ]
                    }
                ]
            },
            {
                location: "Mount Fuji",
                icon: "🗻",
                walkSteps: 6,
                phrases: [
                    {
                        en: '"Goodbye!"',
                        tokens: [
                            { kanji: "さようなら", furigana: ["さ", "よ", "う", "な", "ら"] }
                        ]
                    },
                    {
                        en: '"See you tomorrow!"',
                        tokens: [
                            { kanji: "又", furigana: ["ま"] },
                            { kanji: "明", furigana: ["た", "あ"] },
                            { kanji: "日", furigana: ["した"] }
                        ]
                    }
                ]
            }
        ];

        // Game State Variables
        let currentQuestIdx = 0;
        let currentMode = 'WALK'; // 'WALK' or 'PHRASE'
        let walkProgress = 0;
        let currentPhraseIdx = 0;
        let targetKanaList = [];
        let currentTargetIdx = 0;
        let score = 0;
        let isPaused = false;
        let gameStarted = false;
        let showHints = true;

        // Elements
        const scoreEl = document.getElementById('score');
        const stageNumEl = document.getElementById('stage-num');
        const locationTitleEl = document.getElementById('location-title');
        const destAvatarEl = document.getElementById('dest-avatar');
        const playerAvatarEl = document.getElementById('player-avatar');
        const distanceBarEl = document.getElementById('distance-bar');
        const modeInstructionEl = document.getElementById('mode-instruction');
        const sentenceContainerEl = document.getElementById('sentence-container');
        const englishTranslationEl = document.getElementById('english-translation');
        const overlayEl = document.getElementById('screen-overlay');
        const overlayTitleEl = document.getElementById('overlay-title');
        const overlayDescEl = document.getElementById('overlay-desc');
        const startBtn = document.getElementById('start-btn');
        const hintBtn = document.getElementById('hint-btn');
        const pauseBtn = document.getElementById('pause-btn');

        function initGame() {
            score = 0;
            currentQuestIdx = 0;
            gameStarted = true;
            isPaused = false;
            scoreEl.innerText = score;
            overlayEl.style.display = 'none';
            loadQuest(currentQuestIdx);
        }

        function loadQuest(idx) {
            if (idx >= quests.length) {
                // Game Victory!
                overlayTitleEl.innerText = "JOURNEY COMPLETE!";
                overlayDescEl.innerText = `You traveled across Japan and mastered key phrases! Final Score: ${score}`;
                startBtn.innerText = "PLAY AGAIN";
                overlayEl.style.display = 'flex';
                gameStarted = false;
                return;
            }

            const q = quests[idx];
            stageNumEl.innerText = `${idx + 1}/${quests.length}`;
            locationTitleEl.innerText = q.location;
            destAvatarEl.innerText = q.icon;
            
            walkProgress = 0;
            currentPhraseIdx = 0;
            updateDistanceBar();
            startWalkMode();
        }

        function startWalkMode() {
            currentMode = 'WALK';
            playerAvatarEl.classList.add('walking');
            modeInstructionEl.innerText = "Type the Hiragana step to walk forward!";
            englishTranslationEl.innerText = "";
            spawnWalkStep();
        }

        function spawnWalkStep() {
            const randKana = walkingKanaPool[Math.floor(Math.random() * walkingKanaPool.length)];
            targetKanaList = [randKana];
            currentTargetIdx = 0;
            renderSingleKanaDisplay(randKana);
        }

        function renderSingleKanaDisplay(kana) {
            sentenceContainerEl.innerHTML = '';
            const key = getMatchingKey(kana);

            const wrap = document.createElement('div');
            wrap.className = 'char-unit active';
            
            const kanaSpan = document.createElement('span');
            kanaSpan.innerText = kana;
            kanaSpan.style.fontSize = '3.5rem';

            const hintSpan = document.createElement('span');
            hintSpan.className = 'key-hint';
            hintSpan.innerText = `[${key}]`;

            wrap.appendChild(kanaSpan);
            wrap.appendChild(hintSpan);
            sentenceContainerEl.appendChild(wrap);
        }

        function startPhraseMode() {
            currentMode = 'PHRASE';
            playerAvatarEl.classList.remove('walking');
            modeInstructionEl.innerText = "Arrived! Type the Furigana above the Kanji to practice the phrase:";
            loadPhrase(currentPhraseIdx);
        }

        function loadPhrase(pIdx) {
            const quest = quests[currentQuestIdx];
            const phraseObj = quest.phrases[pIdx];
            
            englishTranslationEl.innerText = phraseObj.en;
            sentenceContainerEl.innerHTML = '';
            targetKanaList = [];
            currentTargetIdx = 0;

            let globalKanaIdx = 0;

            phraseObj.tokens.forEach(token => {
                const ruby = document.createElement('ruby');
                const rb = document.createElement('rb');
                rb.innerText = token.kanji;
                
                const rt = document.createElement('rt');

                token.furigana.forEach(fKana => {
                    targetKanaList.push(fKana);
                    const key = getMatchingKey(fKana);

                    const charSpan = document.createElement('span');
                    charSpan.className = 'char-unit';
                    charSpan.dataset.index = globalKanaIdx;
                    if (globalKanaIdx === 0) charSpan.classList.add('active');

                    const textNode = document.createTextNode(fKana);
                    const hintSpan = document.createElement('span');
                    hintSpan.className = 'key-hint';
                    hintSpan.innerText = `[${key}]`;

                    charSpan.appendChild(textNode);
                    charSpan.appendChild(hintSpan);
                    rt.appendChild(charSpan);

                    globalKanaIdx++;
                });

                ruby.appendChild(rb);
                ruby.appendChild(rt);
                sentenceContainerEl.appendChild(ruby);
            });
        }

        function getMatchingKey(kana) {
            const key = Object.keys(jisMap).find(k => jisMap[k] === kana);
            return key ? key.toUpperCase() : '?';
        }

        function updateDistanceBar() {
            const quest = quests[currentQuestIdx];
            const pct = Math.min(100, (walkProgress / quest.walkSteps) * 100);
            distanceBarEl.style.width = `${pct}%`;
        }

        // Key Input Event Handler
        window.addEventListener('keydown', (e) => {
            // Check ONLY Escape key for pause shortcut
            if (e.key === 'Escape' && gameStarted) {
                togglePause();
                return;
            }

            if (!gameStarted || isPaused) return;

            const key = e.key.toLowerCase();
            const typedKana = jisMap[key];
            if (!typedKana) return;

            const expectedKana = targetKanaList[currentTargetIdx];

            if (typedKana === expectedKana) {
                // Correct Key Typed!
                score += 20;
                scoreEl.innerText = score;

                if (currentMode === 'WALK') {
                    walkProgress++;
                    updateDistanceBar();
                    
                    const quest = quests[currentQuestIdx];
                    if (walkProgress >= quest.walkSteps) {
                        startPhraseMode();
                    } else {
                        spawnWalkStep();
                    }
                } else if (currentMode === 'PHRASE') {
                    // Update active highlight on furigana character
                    const activeEl = sentenceContainerEl.querySelector(`.char-unit[data-index="${currentTargetIdx}"]`);
                    if (activeEl) {
                        activeEl.classList.remove('active');
                        activeEl.classList.add('completed');
                    }

                    currentTargetIdx++;

                    if (currentTargetIdx >= targetKanaList.length) {
                        // Phrase Completed!
                        score += 100;
                        scoreEl.innerText = score;
                        currentPhraseIdx++;
                        
                        const quest = quests[currentQuestIdx];
                        if (currentPhraseIdx >= quest.phrases.length) {
                            // Stage Completed! Move to next stage
                            currentQuestIdx++;
                            setTimeout(() => loadQuest(currentQuestIdx), 600);
                        } else {
                            setTimeout(() => loadPhrase(currentPhraseIdx), 600);
                        }
                    } else {
                        const nextEl = sentenceContainerEl.querySelector(`.char-unit[data-index="${currentTargetIdx}"]`);
                        if (nextEl) nextEl.classList.add('active');
                    }
                }
            }
        });

        function togglePause() {
            if (!gameStarted) return;
            isPaused = !isPaused;

            if (isPaused) {
                overlayTitleEl.innerText = "GAME PAUSED";
                overlayDescEl.innerText = "Press [ESC] or click below to resume your journey.";
                startBtn.innerText = "RESUME GAME";
                overlayEl.style.display = 'flex';
                pauseBtn.innerText = "RESUME [ESC]";
            } else {
                overlayEl.style.display = 'none';
                pauseBtn.innerText = "PAUSE [ESC]";
            }
        }

        function toggleHints() {
            showHints = !showHints;
            if (showHints) {
                document.body.classList.add('show-hints');
                hintBtn.innerText = "HINTS: ON";
                hintBtn.classList.add('active');
            } else {
                document.body.classList.remove('show-hints');
                hintBtn.innerText = "HINTS: OFF";
                hintBtn.classList.remove('active');
            }
        }

        function handleOverlayClick() {
            if (isPaused) {
                togglePause();
            } else {
                initGame();
            }
        }
    </script>
</body>
</html>
